<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
  <title>CRICKCAST</title>
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <style>
    /* ----- RESET & FULLSCREEN BLACK BACKGROUND ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      background: #000000;
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ----- HEADER (logo centered, with white outline) ----- */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(18px, 4vh, 32px) clamp(12px, 3vw, 28px);
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 20;
      min-height: clamp(60px, 8vh, 80px);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08), 0 4px 20px rgba(255, 255, 255, 0.02);
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 10%;
      right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      border-radius: 100%;
    }

    .logo {
      font-size: clamp(1.4rem, 3.5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .logo .crick {
      color: #7dffb3;
      text-shadow: 0 0 60px rgba(125, 255, 179, 0.15);
    }
    .logo .cast {
      color: #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
    }
    .logo .dot {
      color: #7dffb3;
      font-size: 0.35em;
      margin-left: 0.05em;
      opacity: 0.5;
    }

    /* ----- MAIN CONTENT ----- */
    .main {
      margin-top: clamp(60px, 8vh, 80px);
      min-height: calc(100vh - clamp(60px, 8vh, 80px));
      min-height: calc(100dvh - clamp(60px, 8vh, 80px));
      display: flex;
      flex-direction: column;
      background: #000000;
      width: 100%;
    }

    /* ----- 16:9 PLAYER ----- */
    .player-wrapper {
      width: 100%;
      background: #000000;
      flex-shrink: 0;
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      max-height: 70vh;
    }

    @media (min-width: 900px) {
      .player-wrapper {
        padding-bottom: 0;
        height: min(56.25vw, 70vh);
        max-height: 70vh;
      }
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* Watermark overlay on player */
    .watermark {
      position: absolute;
      top: 12px;
      right: 16px;
      z-index: 5;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(0.7rem, 1.4vw, 1rem);
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.05em;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
      user-select: none;
    }
    .watermark .accent { color: #7dffb3; }

    /* ----- TABS (single tab bar retained for future sections; Channels only) ----- */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
      padding: 0;
      width: 100%;
      min-height: clamp(60px, 8vh, 90px);
      position: sticky;
      top: clamp(60px, 8vh, 80px);
      z-index: 15;
    }

    .tab-btn {
      background: transparent;
      border: none;
      padding: clamp(16px, 2.5vh, 28px) clamp(28px, 5vw, 56px);
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 1.8vw, 1.6rem);
      color: #ffffff;
      cursor: default;
      border-bottom: 4px solid #4fc3f7;
      background: rgba(79, 195, 247, 0.06);
      letter-spacing: 0.03em;
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      position: relative;
      min-height: clamp(60px, 8vh, 90px);
    }

    .tab-btn .material-icons {
      font-size: clamp(1.6rem, 2.2vw, 2.4rem);
      color: #4fc3f7;
    }

    /* ----- CHANNELS ----- */
    .channels-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: clamp(12px, 2vw, 20px);
      padding: clamp(16px, 2.5vh, 32px) clamp(16px, 3vw, 40px);
      flex: 1;
      align-content: start;
      width: 100%;
      max-width: 100%;
    }

    @media (min-width: 900px) {
      .channels-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .channel-card {
      background: #121821;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: clamp(18px, 3vh, 32px) clamp(14px, 2vw, 24px);
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      width: 100%;
    }

    .channel-card:hover {
      border-color: rgba(79, 195, 247, 0.3);
      transform: translateY(-3px);
      background: #1a2330;
    }

    .channel-card .icon {
      width: clamp(48px, 6vw, 72px);
      height: clamp(48px, 6vw, 72px);
      border-radius: 50%;
      background: #0a0c0f;
      border: 2px solid rgba(79, 195, 247, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: clamp(16px, 2vw, 24px);
      color: #4fc3f7;
      transition: all 0.3s ease;
    }

    .channel-card:hover .icon {
      border-color: #4fc3f7;
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.1);
    }

    .channel-card .name {
      font-weight: 700;
      font-size: clamp(0.9rem, 1.2vw, 1.2rem);
      color: #f0f2f5;
      letter-spacing: 0.01em;
    }

    .channel-card .badge {
      font-size: 0.65rem;
      color: #8e9baf;
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 14px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-weight: 500;
    }

    .channel-card.active {
      border-color: #4fc3f7;
      box-shadow: 0 0 40px rgba(79, 195, 247, 0.06);
      background: #0f1923;
    }

    .channel-card.active .icon {
      border-color: #4fc3f7;
      box-shadow: 0 0 30px rgba(79, 195, 247, 0.15);
      background: rgba(79, 195, 247, 0.08);
    }

    /* ====== TELEGRAM POPUP ====== */
    #tgOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      padding: 20px;
      animation: fadeInPopup 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    #tgOverlay.show {
      display: flex;
    }

    #tgCard {
      width: 100%;
      max-width: 400px;
      background: linear-gradient(160deg, #121821, #0a0c0f);
      border: 1px solid rgba(79, 195, 247, 0.15);
      border-radius: 24px;
      padding: 36px 28px 28px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(79, 195, 247, 0.03);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    #tgCard::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 20%, rgba(79, 195, 247, 0.04), transparent 60%);
      pointer-events: none;
    }

    #tgIcon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #2AABEE, #229ED9);
      box-shadow: 0 0 40px rgba(42, 171, 238, 0.2);
      position: relative;
      z-index: 1;
    }

    #tgIcon svg {
      width: 36px;
      height: 36px;
    }

    #tgCard h2 {
      margin: 0 0 8px;
      font-size: clamp(1.3rem, 2.5vw, 1.8rem);
      font-weight: 700;
      color: #ffffff;
      font-family: 'Inter', system-ui, sans-serif;
      position: relative;
      z-index: 1;
      letter-spacing: -0.01em;
    }

    #tgCard p {
      margin: 0 0 24px;
      color: #8e9baf;
      font-size: clamp(0.9rem, 1.2vw, 1.05rem);
      line-height: 1.6;
      position: relative;
      z-index: 1;
    }

    .tgBtns {
      display: flex;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .tgBtn {
      flex: 1;
      height: 48px;
      border-radius: 40px;
      font-weight: 700;
      font-size: clamp(0.85rem, 1vw, 1rem);
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.01em;
    }

    #joinNow {
      background: linear-gradient(135deg, #4fc3f7, #2196f3);
      color: #ffffff;
      box-shadow: 0 6px 24px rgba(79, 195, 247, 0.25);
    }

    #joinNow:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(79, 195, 247, 0.35);
    }

    #joinedBtn {
      background: rgba(255, 255, 255, 0.05);
      color: #8e9baf;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #joinedBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    @keyframes fadeInPopup {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (max-width: 480px) {
      #tgCard {
        padding: 24px 18px 20px;
        border-radius: 20px;
      }
      #tgIcon {
        width: 60px;
        height: 60px;
      }
      #tgIcon svg {
        width: 30px;
        height: 30px;
      }
      #tgCard h2 {
        font-size: 1.2rem;
      }
      #tgCard p {
        font-size: 0.85rem;
        margin-bottom: 18px;
      }
      .tgBtn {
        height: 42px;
        font-size: 0.8rem;
      }
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 600px) {
      .header {
        padding: 10px 12px;
        min-height: 48px;
      }
      .header::after {
        left: 5%;
        right: 5%;
      }
      .logo {
        font-size: clamp(1rem, 4.5vw, 1.4rem);
        gap: 1px;
      }
      .main {
        margin-top: 48px;
        min-height: calc(100vh - 48px);
        min-height: calc(100dvh - 48px);
      }
      .tabs {
        min-height: 50px;
        top: 48px;
      }
      .tab-btn {
        padding: 10px 12px;
        font-size: 0.75rem;
        gap: 6px;
        min-height: 50px;
      }
      .tab-btn .material-icons {
        font-size: 1rem;
      }
      .channels-grid {
        gap: 8px;
        padding: 10px;
      }
      .channel-card {
        padding: 14px 10px;
        border-radius: 12px;
      }
      .channel-card .icon {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }
      .channel-card .name {
        font-size: 0.75rem;
      }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .header {
        padding: 6px 16px;
        min-height: 40px;
      }
      .logo {
        font-size: clamp(0.8rem, 2.5vh, 1.2rem);
      }
      .main {
        margin-top: 40px;
        min-height: calc(100vh - 40px);
        min-height: calc(100dvh - 40px);
      }
      .tabs {
        min-height: 42px;
        top: 40px;
      }
      .tab-btn {
        padding: 6px 16px;
        font-size: 0.7rem;
        gap: 4px;
        min-height: 42px;
      }
      .tab-btn .material-icons {
        font-size: 0.9rem;
      }
      .player-wrapper {
        padding-bottom: 50%;
      }
      .channels-grid {
        gap: 6px;
        padding: 8px 12px;
      }
      .channel-card {
        padding: 10px 8px;
        border-radius: 10px;
      }
      .channel-card .icon {
        width: 32px;
        height: 32px;
        font-size: 11px;
      }
      .channel-card .name {
        font-size: 0.65rem;
      }
    }

    @media (min-width: 1200px) {
      .header {
        padding: 28px 40px;
        min-height: 90px;
      }
      .header::after {
        left: 15%;
        right: 15%;
      }
      .logo {
        font-size: 2.8rem;
      }
      .main {
        margin-top: 90px;
        min-height: calc(100vh - 90px);
        min-height: calc(100dvh - 90px);
      }
      .tabs {
        min-height: 100px;
        top: 90px;
      }
      .tab-btn {
        padding: 28px 56px;
        font-size: 1.6rem;
        gap: 18px;
        min-height: 100px;
      }
      .tab-btn .material-icons {
        font-size: 2.4rem;
      }
      .channels-grid {
        gap: 24px;
        padding: 32px 48px;
      }
      .channel-card {
        padding: 32px 28px;
        border-radius: 20px;
      }
      .channel-card .icon {
        width: 80px;
        height: 80px;
        font-size: 28px;
      }
      .channel-card .name {
        font-size: 1.4rem;
      }
    }

    /* ----- ANIMATION ----- */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- HEADER with centered logo -->
  <header class="header">
    <div class="logo">
      <span class="crick">Crick</span><span class="cast">Cast</span><span class="dot">•</span>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <div class="main">

    <!-- 16:9 PLAYER (full width, just below header) -->
    <div class="player-wrapper">
      <iframe id="playerFrame" src="https://allrounder3-0.pages.dev/cricket/sony-3" allowfullscreen loading="lazy" title="Live Match" allow="encrypted-media; fullscreen; autoplay"></iframe>
      <div class="watermark">Crick<span class="accent">Cast</span></div>
    </div>

    <!-- TAB BAR: Channels only -->
    <div class="tabs">
      <button class="tab-btn" data-tab="channels">
        <span class="material-icons">live_tv</span>
        <span>Channels</span>
      </button>
    </div>

    <!-- Channels -->
    <div class="tab-content active" id="channels">
      <div class="channels-grid" id="channelsGrid">
        <!-- injected by JS -->
      </div>
    </div>

  </div>

  <!-- ====== TELEGRAM POPUP ====== -->
  <div id="tgOverlay">
    <div id="tgCard">
      <div id="tgIcon">
        <svg viewBox="0 0 24 24" fill="white" width="36" height="36">
          <path d="M23.05 2.1L19.6 21.3c-.26 1.15-.94 1.43-1.9.9l-5.26-3.88-2.54 2.45c-.28.28-.52.52-1.06.52l.38-5.4L19.9 5.8c.46-.4-.1-.63-.72-.23L7.5 13.03l-5.24-1.64c-1.14-.36-1.16-1.14.24-1.68L21.6.9c.95-.36 1.78.23 1.45 1.2z"/>
        </svg>
      </div>
      <h2>Join Telegram Channel</h2>
      <p>Get match links &amp; live updates delivered straight to your phone.</p>
      <div class="tgBtns">
        <button class="tgBtn" id="joinedBtn">Already Joined</button>
        <button class="tgBtn" id="joinNow">Join Now</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ----- CHANNELS DATA -----
      const channels = [
        { name: 'Hindi', url: 'https://allrounder3-0.pages.dev/cricket/sony-3', logo: 'HN' },
        { name: 'English', url:' https://crickcast-cricbuzz.pages.dev/?id=B0HCX5GP83',logo: 'WL' },
        { name: 'All Device', url: 'https://allrounder-live12.pages.dev/hotstar', logo: 'IOS' },
        { name: 'TNT', url: 'https://allrounder3-0.pages.dev/cricket/tnt', logo: 'TNT' },
        { name: 'Willow TV', url: 'https://allrounder3-0.pages.dev/cricket/willow', logo: 'WT' }
      ];

      const grid = document.getElementById('channelsGrid');
      const playerIframe = document.getElementById('playerFrame');
      let currentIndex = 0;

      // ----- RENDER CHANNELS -----
      function renderChannels(activeIndex) {
        grid.innerHTML = channels.map((ch, index) => `
          <div class="channel-card ${index === activeIndex ? 'active' : ''}" data-index="${index}">
            <div class="icon">${ch.logo}</div>
            <div class="name">${ch.name}</div>
            <div class="badge">HD · Live</div>
          </div>
        `).join('');

        grid.querySelectorAll('.channel-card').forEach(card => {
          card.addEventListener('click', function() {
            const idx = parseInt(this.dataset.index);
            switchChannel(idx);
          });
        });
      }

      // ----- SWITCH CHANNEL -----
      function switchChannel(index) {
        const ch = channels[index];
        if (!ch) return;
        currentIndex = index;
        playerIframe.src = ch.url;
        grid.querySelectorAll('.channel-card').forEach(c => {
          c.classList.toggle('active', parseInt(c.dataset.index) === index);
        });
      }

      renderChannels(0);

      // ====== TELEGRAM POPUP ======
      const tgOverlay = document.getElementById('tgOverlay');

      setTimeout(function() {
        tgOverlay.classList.add('show');
      }, 3000);

      document.getElementById('joinNow').onclick = function() {
        window.open('https://t.me/addlist/6qALMSdKoVVkNWI1', '_blank');
        tgOverlay.classList.remove('show');
      };

      document.getElementById('joinedBtn').onclick = function() {
        tgOverlay.classList.remove('show');
      };

      tgOverlay.addEventListener('click', function(e) {
        if (e.target === tgOverlay) {
          tgOverlay.classList.remove('show');
        }
      });

    })();
  </script>

</body>
</html>
