<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no"
  >
  <meta name="referrer" content="no-referrer">

  <title>CrickCast Live</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    /* Full-page player */
    .player-wrapper {
      position: fixed;
      top: 0;
      left: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;
      background: #000;
    }

    /* Iframe */
    .player-wrapper iframe {
      display: block;

      width: 100%;
      height: 100%;

      border: 0;
      margin: 0;
      padding: 0;
    }

    /* =========================================
       CRICKCAST WATERMARK
       ========================================= */

    #watermark {
      position: fixed;

      top: 12px;
      left: 12px;

      z-index: 99999;

      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.55);

      border: 1px solid rgba(0, 229, 255, 0.3);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      font-family:
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 15px;
      font-weight: 700;

      line-height: 1;

      color: #fff;

      pointer-events: none;
      user-select: none;
    }

    #watermark b {
      color: #00e5ff;
    }

    /* Mobile */
    @media (max-width: 700px) {
      #watermark {
        top: 10px;
        left: 10px;

        padding: 6px 10px;

        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- FULL SCREEN PLAYER -->
  <div class="player-wrapper">

    <iframe
      src="https://twitcasting.tv/c:arjitkumar/embeddedplayer/live?auto_play=true&default_mute=true"
      sandbox="allow-scripts allow-same-origin"
      referrerpolicy="no-referrer"
      allow="encrypted-media; fullscreen"
      allowfullscreen
      title="Full page video player">
    </iframe>

  </div>


  <!-- CRICKCAST WATERMARK -->
  <div id="watermark">
    Crickcast <b>LIVE</b>
  </div>


</body>
</html>
