  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .player-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;

    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #watermark {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 99999;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 229, 255, 0.3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    #watermark b {
      color: #00e5ff;
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 65px;
      transform: translateX(-50%);
      z-index: 10;
      max-width: 90%;
      color: #fff;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      text-align: center;
    }

    #status:empty {
      display: none;
    }

    @media (max-width: 700px) {
      #watermark {
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="player-container">
    <video
      id="video"
      controls
      autoplay
      muted
      playsinline
      preload="auto">
    </video>
  </div>

  <!-- Crickcast LIVE Watermark -->
  <div id="watermark">Crickcast <b>LIVE</b></div>

  <div id="status">Connecting to stream...</div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const video = document.getElementById("video");
      const status = document.getElementById("status");

      const streamUrl =
        "https://papacito.cfd/m3u/2161753/live.m3u8";

      function showStatus(message) {
        status.textContent = message;
      }

      function clearStatus() {
        status.textContent = "";
      }

      video.addEventListener("playing", clearStatus);

      video.addEventListener("waiting", function () {
        showStatus("Buffering stream...");
      });

      video.addEventListener("error", function () {
        showStatus("Playback failed. Check stream availability or browser console.");
      });

      if (video.canPlayType("application/vnd.apple.mpegurl")) {
        // Native HLS support (commonly Safari)
        video.src = streamUrl;

        video.play().catch(function () {
          showStatus("Press Play to start the stream.");
        });
      } else if (Hls.isSupported()) {
        // HLS playback via Media Source Extensions
        const hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 30,
          manifestLoadingTimeOut: 15000,
          manifestLoadingMaxRetry: 3,
          levelLoadingMaxRetry: 3,
          fragLoadingMaxRetry: 3
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          showStatus("Stream ready. Starting playback...");

          video.play().then(function () {
            clearStatus();
          }).catch(function () {
            showStatus("Stream ready. Press Play to start.");
          });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (!data.fatal) return;

          console.error("HLS playback error:", data);

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            showStatus("Network error. The stream may be unavailable or blocked.");
            hls.startLoad();
          } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            showStatus("Recovering media playback...");
            hls.recoverMediaError();
          } else {
            showStatus("Unable to play this stream. Check the stream URL and browser console.");
            hls.destroy();
          }
        });
      } else {
        showStatus("This browser does not support HLS playback.");
      }
    });
  </script>
