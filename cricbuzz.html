
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA WORLD CUP 2026</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
    }

    .player-container {
      position: fixed;
      inset: 0;
      background: #000;
    }

    .player-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #000;
    }

    #watermark {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 99999;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      pointer-events: none;
      user-select: none;
    }

    #watermark b {
      color: #00e5ff;
    }

    @media (max-width: 700px) {
      #watermark {
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>

  <!-- Adsterra Popunder -->
  <script src="YOUR_ADSTERRA_POPUNDER_SCRIPT"></script>
</head>

<body>
  <div class="player-container">
    <iframe
      src="YOUR_AUTHORIZED_EMBED_PLAYER_URL"
      title="Live Player"
      allow="autoplay; fullscreen; picture-in-picture"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <div id="watermark">
    Crickcast <b>LIVE</b>
  </div>

  <!-- Adsterra Social Bar -->
  <script src="YOUR_ADSTERRA_SOCIAL_BAR_SCRIPT"></script>
</body>
</html>
