    document.addEventListener('DOMContentLoaded', async () => {
      const status = document.getElementById('status');
      const video = document.querySelector('video');
      const container = document.querySelector('.shaka-video-container');

      // Stream URL, cleaned of the leading "=" and trailing quote.

        setStatus('This browser does not support Shaka Player.');
        return;

      let player;

        player = new shaka.Player();
        await player.attach(video);

        const ui = new shaka.ui.Overlay(player, container, video);
        ui.configure({
          controlPanelElements: [
            'play_pause',
            'time_and_duration',
            'mute',
            'volume',
            'spacer',
            'language',
            'captions',
            'picture_in_picture',
            'quality',
            'fullscreen'
          ]
        });

        player.configure({
          streaming: {
            bufferingGoal: 15,
            rebufferingGoal: 2,
            bufferBehind: 15,
            retryParameters: {
              timeout: 15000,
              maxAttempts: 4,
              baseDelay: 500,
              backoffFactor: 1.5
            }
          },
          manifest: {
            retryParameters: {
              timeout: 15000,
              maxAttempts: 3,
              baseDelay: 500
            }
          }
        });

        player.addEventListener('error', event => {
          const error = event.detail;
          console.error('Shaka error:', error);
          setStatus(
            'Playback error — code: ' + error.code +
            '. Check stream authorization, DRM configuration, CORS, and network access.'
          );
        });

        setStatus('Loading stream…');
        await player.load(streamUrl);
        setStatus('Stream loaded. Press Play if playback did not start automatically.');

        try {
          await video.play();
        } catch (error) {
          // Mobile browsers may require a user gesture before playback.
          setStatus('Stream loaded. Tap Play to start playback.');
        }
      } catch (error) {
        console.error('Player initialization/load failed:', error);
        setStatus(
          'Unable to load stream. Check the browser console for details. ' +
          'The provider may require authorized DRM settings or CORS access.'
        );
      }
    });
  </script>
