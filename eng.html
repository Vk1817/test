<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA WORLD CUP 2026</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* CRICKCAST WATERMARK */
    #watermark {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 99999;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(0, 0, 0, .55);
      border: 1px solid rgba(0, 229, 255, .3);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      font-weight: 700;
      color: #fff;
      pointer-events: none;
      user-select: none;
    }

    #watermark b {
      color: #00e5ff;
    }

    @media (max-width: 700px) {
      #watermark {
        top: 10px;
        left: 10px;
        padding: 6px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div class="shaka-video-container" data-shaka-player>
    <video autoplay muted playsinline preload="metadata"
      poster="https://w0.peakpx.com/wallpaper/183/933/HD-wallpaper-fifa-world-cup-26-u-sports-soccer-mexico-canada-football-fifa-world-cup-world-cup-2026-we-are-26-sport-event-international-competition-global-event-tournament.jpg">
    </video>
  </div>

  <div id="watermark">Crickcast <b>LIVE</b></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      shaka.polyfill.installAll();

      if (!shaka.Player.isBrowserSupported()) {
        console.error('Browser not supported');
        return;
      }

      const video = document.querySelector('video');
      const player = new shaka.Player();
      await player.attach(video);

      const container = document.querySelector('.shaka-video-container');
      const ui = new shaka.ui.Overlay(player, container, video);

      ui.configure({
        controlPanelElements: [
          'play_pause',
          'time_and_duration',
          'mute',
          'volume',
          'spacer',
          'language',
          'captions',
          'picture_in_picture',
          'quality',
          'fullscreen'
        ],
        volumeBarColors: {
          base: 'rgba(0, 136, 255, 0.3)',
          level: 'rgb(0, 136, 255)'
        },
        seekBarColors: {
          base: 'rgba(90, 0, 0, 0.3)',
          buffered: 'rgba(120, 0, 0, 0.6)',
          played: 'rgb(170, 0, 0)'
        }
      });

      const drmConfig = {
        clearKeys: {
          "881660f21b521a54803840a388caaffa":
          "b152a33ccb29c23fc05f8e6379f69551"
        }
      };

      const streamUrl =
        "https://a96aivottlinear-a.akamaihd.net/OTTB/iad-nitro/live/clients/dash/enc/rg1wbyohtc/out/v1/e3fc25fcd54141b0a1aa39c1b04c0d7b/cenc.mpd";

      player.configure({
        drm: drmConfig,

        streaming: {
          lowLatencyMode: true,
          bufferingGoal: 15,
          rebufferingGoal: 2,
          bufferBehind: 15,

          retryParameters: {
            timeout: 10000,
            maxAttempts: 5,
            baseDelay: 300,
            backoffFactor: 1.2
          },

          segmentRequestTimeout: 8000,
          segmentPrefetchLimit: 2,
          useNativeHlsOnSafari: true
        },

        manifest: {
          retryParameters: {
            timeout: 8000,
            maxAttempts: 3
          }
        }
      });

      player.addEventListener('error', (event) => {
        console.error('Shaka Player Error:', event.detail);
      });

      try {
        await player.load(streamUrl);
        console.log('Stream loaded successfully');
        video.play().catch(() => {});
      } catch (error) {
        console.error('Load error:', error);
      }
    });
  </script>

</body>
</html>
