/* CRICKCAST WATERMARK */

/* SMALL SECONDARY WATERMARK */

  position:absolute;

  color:rgba(255,255,255,.12);
}

/* ERROR / STATUS */

#status{
  position:fixed;

  top:max(16px,env(safe-area-inset-top));
  right:16px;

  z-index:9997;

  display:flex;
  align-items:center;
  gap:7px;

  border:1px solid rgba(255,255,255,.07);

  font-size:11.5px;
  font-weight:500;

  letter-spacing:.2px;

  border-radius:24px;

  pointer-events:none;

  opacity:0;

  transition:opacity .25s ease;

  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);

  white-space:nowrap;

  box-shadow:0 2px 14px rgba(0,0,0,.45);

  color:#c0c0c0;
}

#status.show{
  opacity:1;
}

.st-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  flex-shrink:0;

  display:inline-block;

  background:#60a5fa;
}

#status.live .st-dot{
  background:#22d3a0;
}

#status.warn .st-dot{
  background:#fb923c;
}

#status.err .st-dot{
  background:#f87171;
}

/* CONTROLS */

#controls{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:9998;

  display:flex;
  align-items:center;
  gap:10px;

  padding:
    18px
    15px
    max(14px,env(safe-area-inset-bottom));

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.85)
    );

  opacity:0;

  transition:opacity .25s ease;
}

#player-container:hover #controls,
#controls.show{
  opacity:1;
}

.control-btn{
  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:rgba(0,0,0,.65);

  color:#fff;

  cursor:pointer;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:16px;
}

.control-btn:hover{
  background:rgba(0,229,255,.2);
}

#liveBtn{
  font-size:10px;
  font-weight:700;

  border-radius:6px;

  width:auto;

  padding:0 9px;
}

#quality{
  color:#fff;
  background:transparent;

  border:0;

  cursor:pointer;

  font-size:13px;
}

#fullscreenBtn{
  margin-left:auto;
}

/* MOBILE */

@media(max-width:600px){

  #watermark{
    top:10px;
    left:10px;

    padding:6px 10px;

  }

  }

  .custom-watermark{
    left:16%;
    top:60%;
    font-size:9px;
  }

  .control-btn{
    width:35px;
    height:35px;
  }

}

<script>

(function(){

"use strict";


/* =====================================================
   YOUR EXACT HLS LINK
   ===================================================== */

const STREAM_URL =
"https://in-mc-flive.fancode.com/mumbai/4248491_english_hls_708908f4d035358_1ta-di_h264/1080p.m3u8?hdntl=Expires=1789392659~_GO=Generated~acl=/mumbai/4248491_english_hls_708908f4d035358_1ta-di_h264/*~Signature=AWDec-E33A5I0q5BAkjtpoWZAc3Q-FATmuUsUpdvv4lNmF0173baG0GBcBB8bnvSdOZLu8nInK3dQIIyWkb-xxm069QH";


/* =====================================================
   ELEMENTS
   ===================================================== */

const video =
document.getElementById("video");

const playerContainer =
document.getElementById(
  "player-container"
);

const status =
document.getElementById("status");

const statusText =
document.getElementById("statusText");

const playBtn =
document.getElementById("playBtn");

const muteBtn =
document.getElementById("muteBtn");

const liveBtn =
document.getElementById("liveBtn");

const qualityBtn =
document.getElementById("qualityBtn");

const fullscreenBtn =
document.getElementById(
  "fullscreenBtn"
);

const controls =
document.getElementById("controls");


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
  text,
  type
){

  statusText.textContent =
    text;

  status.className =
    "show " +
    type;

}


/* =====================================================
   HLS
   ===================================================== */

let hls = null;


function startHLS(){

  setStatus(
    "Loading",
    "warn"
  );


  if(Hls.isSupported()){

    hls = new Hls({

      enableWorker:true,

      lowLatencyMode:true,

      liveSyncDurationCount:3,

      maxLiveSyncPlaybackRate:1.2,

      backBufferLength:30,

      maxBufferLength:10

    });


    hls.loadSource(
      STREAM_URL
    );


    hls.attachMedia(
      video
    );


    hls.on(
      Hls.Events.MANIFEST_PARSED,
      function(){

        setStatus(
          "Live",
          "live"
        );

        video.muted = true;

        video.play()
          .then(function(){

            muteBtn.textContent =
              "🔊";

          })
          .catch(function(){

            setStatus(
              "Tap Play",
              "warn"
            );

          });

      }
    );


    hls.on(
      Hls.Events.ERROR,
      function(
        event,
        data
      ){

        console.error(
          "HLS:",
          data
        );


        if(
          data.fatal
        ){

          setStatus(
            "Stream Error",
            "err"
          );

        }

      }
    );

  }

  else if(
    video.canPlayType(
      "application/vnd.apple.mpegurl"
    )
  ){

    /*
      Native HLS fallback
      for Safari / supported browsers
    */

    video.src =
      STREAM_URL;


    video.addEventListener(
      "loadedmetadata",
      function(){

        setStatus(
          "Live",
          "live"
        );

        video.play()
          .catch(function(){});

      },
      {
        once:true
      }
    );

  }

  else{

    setStatus(
      "HLS Not Supported",
      "err"
    );

  }

}


/* =====================================================
   PLAY / PAUSE
   ===================================================== */

playBtn.addEventListener(
  "click",
  function(){

    if(video.paused){

      video.play()
        .catch(function(){});

    }
    else{

      video.pause();

    }

  }
);


video.addEventListener(
  "play",
  function(){

    playBtn.textContent =
      "❚❚";

  }
);


video.addEventListener(
  "pause",
  function(){

    playBtn.textContent =
      "▶";

  }
);


/* =====================================================
   MUTE
   ===================================================== */

muteBtn.addEventListener(
  "click",
  function(){

    video.muted =
      !video.muted;

    muteBtn.textContent =
      video.muted
        ? "🔇"
        : "🔊";

  }
);


/* =====================================================
   LIVE BUTTON
   ===================================================== */

liveBtn.addEventListener(
  "click",
  function(){

    if(
      hls &&
      hls.liveSyncPosition
    ){

      video.currentTime =
        hls.liveSyncPosition;

    }

  }
);


/* =====================================================
   FULLSCREEN
   ===================================================== */

fullscreenBtn.addEventListener(
  "click",
  function(){

    if(
      document.fullscreenElement
    ){

      document.exitFullscreen();

    }
    else if(
      playerContainer.requestFullscreen
    ){

      playerContainer.requestFullscreen();

    }
    else if(
      video.webkitEnterFullscreen
    ){

      video.webkitEnterFullscreen();

    }

  }
);


/* =====================================================
   SHOW CONTROLS
   ===================================================== */

let controlsTimer;

function showControls(){

  controls.classList.add(
    "show"
  );

  clearTimeout(
    controlsTimer
  );

  controlsTimer =
    setTimeout(
      function(){

        controls.classList.remove(
          "show"
        );

      },
      3000
    );

}


playerContainer.addEventListener(
  "pointermove",
  showControls
);

playerContainer.addEventListener(
  "click",
  showControls
);


/* =====================================================
   USER INTERACTION
   ===================================================== */

playerContainer.addEventListener(
  "pointerdown",
  function(){

    if(video.muted){

      video.muted =
        false;

      muteBtn.textContent =
        "🔊";

    }

  },
  {
    once:true
  }
);


/* =====================================================
   START
   ===================================================== */

startHLS();


})();
</script>
