# Temporary one-time migration workflow
name: Apply Adsterra Popunder

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-ad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Adsterra snippet to every HTML page
        shell: python
        run: |
          from pathlib import Path

          snippet = '<!-- Adsterra Popunder -->\n  <script src="https://pl31453790.profitableratecpmnetwork.com/99/94/3d/99943d2b6c5f2e859ee8a98ed60253f2.js"></script>'
          marker = '<!-- Adsterra Popunder -->'

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue
              if '</head>' not in text:
                  print(f'Skipping {path}: no closing </head>')
                  continue
              path.write_text(text.replace('</head>', snippet + '\n</head>', 1), encoding='utf-8')
              changed.append(str(path))

          print('Changed:', changed)

      - name: Commit HTML changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-adsterra.yml
          git add '*.html' .github/workflows/apply-adsterra.yml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add Adsterra popunder to all HTML pages"
          git push
