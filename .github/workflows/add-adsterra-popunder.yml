name: Add Adsterra Popunder

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-ad:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Adsterra Popunder to HTML pages
        shell: python
        run: |
          from pathlib import Path

          snippet = '<!-- Adsterra Popunder -->\n  <script src="https://pl31453790.profitableratecpmnetwork.com/99/94/3d/99943d2b6c5f2e859ee8a98ed60253f2.js"></script>'
          marker = '<!-- Adsterra Popunder -->'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue

              if '</head>' not in text:
                  print(f'Skipping {path}: no closing </head> tag found')
                  continue

              updated = text.replace('</head>', f'{snippet}\n</head>', 1)
              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-adsterra-popunder.yml
          git add '*.html' .github/workflows/add-adsterra-popunder.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Adsterra popunder to HTML pages"
          git push
