name: Add Adsterra Social Bar

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-socialbar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Adsterra Social Bar to HTML pages
        shell: python
        run: |
          from pathlib import Path

          snippet = '<!-- Adsterra Social Bar -->\n  <script src="https://pl31462793.profitableratecpmnetwork.com/d6/4b/36/d64b36bf477d6826fb50d6452488a0a6.js"></script>'
          marker = '<!-- Adsterra Social Bar -->'

          changed = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  continue

              if '</body>' not in text:
                  print(f'Skipping {path}: no closing </body> tag found')
                  continue

              updated = text.replace('</body>', f'{snippet}\n</body>', 1)
              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-adsterra-socialbar.yml
          git add '*.html' .github/workflows/add-adsterra-socialbar.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add Adsterra Social Bar to all HTML pages"
          git push
