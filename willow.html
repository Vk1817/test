<body>

  <div class="shaka-video-container" data-shaka-player>
    <video
      autoplay

    </video>

  <div id="error-message"></div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const errorBox = document.getElementById('error-message');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function hideError() {
        errorBox.style.display = 'none';
      }

      try {
        // Install browser polyfills
        shaka.polyfill.installAll();

        if (!shaka.Player.isBrowserSupported()) {
          showError('Your browser does not support Shaka Player.');
          return;
        }

        const video = document.querySelector('video');
        const container = document.querySelector('.shaka-video-container');

        const player = new shaka.Player();
        await player.attach(video);

        // Shaka UI configuration
        const ui = new shaka.ui.Overlay(
          player,
          container,
          video
        );

        ui.configure({
          controlPanelElements: [
            'play_pause',
            'time_and_duration',
            'mute',
            'volume',
            'spacer',
            'language',
            'captions',
            'picture_in_picture',
            'quality',
            'fullscreen'
          ],

          volumeBarColors: {
            base: 'rgba(0, 136, 255, 0.3)',
            level: 'rgb(0, 136, 255)'
          },

          seekBarColors: {
            base: 'rgba(90, 0, 0, 0.3)',
            buffered: 'rgba(120, 0, 0, 0.6)',
            played: 'rgb(170, 0, 0)'
          }
        });

        /*
          Add your authorised Clear Key pair here.
          Keep these values private; do not publish DRM keys in public HTML.
        */
        const drmConfig = {
          clearKeys: {
            "YOUR_KEY_ID": "YOUR_KEY_VALUE"
          }
        };

        const streamUrl =
          "https://otte.cache.aiv-cdn.net/iad-nitro/live/clients/dash/enc/cs4bb976aa/out/v1/18bfdac2326c4055b5be76a41172ff9c/cenc.mpd";

        // Player configuration
        player.configure({
          drm: drmConfig,

          streaming: {
            lowLatencyMode: true,
            bufferingGoal: 15,
            rebufferingGoal: 2,
            bufferBehind: 15,

            retryParameters: {
              timeout: 10000,
              maxAttempts: 5,
              baseDelay: 300,
              backoffFactor: 1.2
            },

            segmentRequestTimeout: 8000,
            segmentPrefetchLimit: 2
          },

          manifest: {
            retryParameters: {
              timeout: 8000,
              maxAttempts: 3
            }
          }
        });

        // Player error handling
        player.addEventListener('error', event => {
          console.error('Shaka Player Error:', event.detail);

          showError(
            'Playback error. Check the browser console for details.'
          );
        });

        video.addEventListener('playing', hideError);

        video.addEventListener('waiting', () => {
          showError('Buffering stream...');
        });

        // Load DASH stream
        try {
          hideError();

          await player.load(streamUrl);

          console.log('Stream loaded successfully.');

          video.play().catch(error => {
            console.warn('Autoplay blocked:', error);
            showError('Stream loaded. Press the Play button to start.');
          });

        } catch (error) {
          console.error('Stream Load Error:', error);

          showError(
            'Unable to load stream. Check the manifest, network access and DRM configuration.'
          );
        }

      } catch (error) {
        console.error('Player initialization error:', error);
        showError('Player initialization failed. Check browser compatibility.');
      }
    });
  </script>
