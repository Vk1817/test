<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIFA WORLD CUP 2026</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/shaka-player.ui.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.7.11/controls.min.css" crossorigin="anonymous">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FMP9REY96D"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-FMP9REY96D');
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      background: #000;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .shaka-video-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      object-fit: contain;
    }

    /* =========================================
       CRICKCAST WATERMARK
       ========================================= */

    #crickcast-watermark {
      position: fixed;
      top: 12px;
      left: 12px;

      z-index: 9999;

      padding: 7px 12px;

      border-radius: 999px;

      background: rgba(0, 0, 0, 0.55);

      border: 1px solid rgba(0, 229, 255, 0.3);

      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);

      color: #fff;

      font-size: 15px;
      font-weight: 700;

      line-height: 1;

      letter-spacing: .1px;

      pointer-events: none;
      user-select: none;
    }

    #crickcast-watermark b {
      color: #00e5ff;
    }

    /* =========================================
       SUBTLE SECONDARY WATERMARK
       ========================================= */

    .custom-watermark {
      position: absolute;

      z-index: 40;

      pointer-events: none;

      top: 65%;
      left: 6%;

      transform: translateY(-50%);

      font-size: 11px;
      font-weight: 600;

      color: rgba(255,255,255,0.12);
    }

    /* =========================================
       HIDE SHAKA SPINNER
       ========================================= */

    .shaka-spinner-container,
    .shaka-spinner,
    .shaka-spinner-svg {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
    }

    /* =========================================
       MOBILE
       ========================================= */

    @media(max-width:700px) {

      #crickcast-watermark {
        top: 10px;
        left: 10px;

        padding: 6px 10px;

        font-size: 13px;
      }

      .custom-watermark {
        font-size: 9px;
        top: 60%;
        left: 16%;
      }
    }
  </style>
</head>

<body>

  <div class="shaka-video-container" data-shaka-player>

    <video
      autoplay
      playsinline
      preload="metadata"
      poster="https://w0.peakpx.com/wallpaper/183/933/HD-wallpaper-fifa-world-cup-26-u-sports-soccer-mexico-canada-football-fifa-world-cup-world-cup-2026-we-are-26-sport-event-international-competition-global-event-tournament.jpg">
    </video>

    <!-- Secondary watermark -->
    <div class="custom-watermark"></div>

  </div>


  <!-- =========================================
       CRICKCAST LIVE WATERMARK
       ========================================= -->

  <div id="crickcast-watermark">
    Crickcast <b>LIVE</b>
  </div>


  <script>

    document.addEventListener(
      'DOMContentLoaded',
      async () => {

        shaka.polyfill.installAll();


        if (!shaka.Player.isBrowserSupported()) {

          console.error(
            'Browser not supported'
          );

          return;
        }


        const video =
          document.querySelector('video');


        const player =
          new shaka.Player();


        await player.attach(video);


        const container =
          document.querySelector(
            '.shaka-video-container'
          );


        const ui =
          new shaka.ui.Overlay(
            player,
            container,
            video
          );


        /* =========================================
           SHAKA UI
           ========================================= */

        ui.configure({

          controlPanelElements: [

            'play_pause',
            'time_and_duration',
            'mute',
            'volume',
            'spacer',
            'language',
            'captions',
            'picture_in_picture',
            'quality',
            'fullscreen'

          ],

          volumeBarColors: {

            base:
              'rgba(0, 136, 255, 0.3)',

            level:
              'rgb(0, 136, 255)'

          },

          seekBarColors: {

            base:
              'rgba(90, 0, 0, 0.3)',

            buffered:
              'rgba(120, 0, 0, 0.6)',

            played:
              'rgb(170, 0, 0)'

          }

        });


        /* =========================================
           DRM
           ========================================= */

        let drmConfig = {

          clearKeys: {

            "34d9aa9c9437b91d9235b62cbe5ce551":
              "6851a07451382c5eadffe9cb7a130440"

          }

        };


        /* =========================================
           STREAM
           ========================================= */

        let streamUrl =
          "https://a96aivottlinear-a.akamaihd.net/OTTB/pdx-nitro/live/clients/dash/enc/va142ya1td/out/v1/aae3c310bf7446e9a8dd88ed7de5b1ee/cenc.mpd";


        /* =========================================
           PLAYER CONFIG
           ========================================= */

        player.configure({

          drm:
            drmConfig,

          streaming: {

            lowLatencyMode:
              true,

            bufferingGoal:
              15,

            rebufferingGoal:
              2,

            bufferBehind:
              15,

            retryParameters: {

              timeout:
                10000,

              maxAttempts:
                5,

              baseDelay:
                300,

              backoffFactor:
                1.2

            },

            segmentRequestTimeout:
              8000,

            segmentPrefetchLimit:
              2,

            useNativeHlsOnSafari:
              true

          },

          manifest: {

            retryParameters: {

              timeout:
                8000,

              maxAttempts:
                3

            }

          }

        });


        /* =========================================
           ERROR HANDLER
           ========================================= */

        player.addEventListener(
          'error',
          (event) => {

            console.error(
              'Shaka Player Error:',
              event.detail
            );

          }
        );


        /* =========================================
           LOAD STREAM
           ========================================= */

        try {

          await player.load(
            streamUrl
          );

          console.log(
            "Stream loaded successfully"
          );

        } catch (error) {

          console.error(
            'Load error:',
            error
          );

        }

      }
    );

  </script>

</body>
</html>
